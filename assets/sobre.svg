<svg xmlns="http://www.w3.org/2000/svg" width="960" height="375" viewBox="0 0 960 375" role="img" aria-labelledby="title desc"><title id="title">Sobre mim — de processos a sistemas</title><desc id="desc">Minha experiência com processos e implantação de ERP me aproximou do desenvolvimento de sistemas. Hoje sou estagiário na PRODAM e estudante de ADS na Cruzeiro do Sul. Pratico consultas em Oracle, leio PL/SQL e desenvolvo exercícios em C e JavaScript.</desc><rect x="1" y="1" width="958" height="373" rx="12" fill="#131210" stroke="#35312b"/><path d="M1 44H959" stroke="#35312b"/><circle cx="24" cy="23" r="4" fill="#ec8e7e"/><circle cx="42" cy="23" r="4" fill="#dfb379"/><circle cx="60" cy="23" r="4" fill="#80cbc4"/><text x="480.0" y="29" fill="#aaa398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle">~/sobre-mim</text><text x="28" y="83" fill="#80cbc4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">$ cat trajetoria.md</text><text x="28" y="118" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Minha experiência com processos e implantação de</text><text x="28" y="146" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">ERP me aproximou do desenvolvimento de sistemas.</text><text x="28" y="174" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Hoje sou estagiário na PRODAM e estudante de ADS</text><text x="28" y="202" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">na Cruzeiro do Sul.</text><text x="28" y="242" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Acompanho sistemas de folha de pagamento e estudo</text><text x="28" y="270" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">o caminho entre os dados de cadastro e o</text><text x="28" y="298" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">contracheque.</text><text x="28" y="346" fill="#80cbc4" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Entender o processo. Construir a solução.</text><rect x="575" y="69" width="357" height="240" rx="7" fill="#0b0a09" stroke="#35312b"/><text x="592" y="97" fill="#aaa398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">bruno.json</text><path d="M575 112H932" stroke="#35312b"/><text x="591" y="137" fill="#aaa398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">{</text><text x="591" y="156" fill="#dfd9d0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  <tspan fill="#c792ea">&quot;atuação&quot;</tspan>: <tspan fill="#f3d17a">&quot;estágio na PRODAM&quot;</tspan>,</text><text x="591" y="175" fill="#dfd9d0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  <tspan fill="#c792ea">&quot;formação&quot;</tspan>: <tspan fill="#f3d17a">&quot;ADS&quot;</tspan>,</text><text x="591" y="194" fill="#dfd9d0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  <tspan fill="#c792ea">&quot;prática&quot;</tspan>: [</text><text x="591" y="213" fill="#dfd9d0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">    <tspan fill="#f3d17a">&quot;Oracle&quot;</tspan>, <tspan fill="#f3d17a">&quot;PL/SQL&quot;</tspan>,</text><text x="591" y="232" fill="#dfd9d0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">    <tspan fill="#f3d17a">&quot;C&quot;</tspan>, <tspan fill="#f3d17a">&quot;JavaScript&quot;</tspan></text><text x="591" y="251" fill="#82aaff" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  ]</text><text x="591" y="270" fill="#aaa398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">}</text></svg>
