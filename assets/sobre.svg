<svg xmlns="http://www.w3.org/2000/svg" width="960" height="375" viewBox="0 0 960 375" role="img" aria-labelledby="title desc"><title id="title">Sobre mim — de processos a sistemas</title><desc id="desc">Minha experiência com processos e implantação de ERP me aproximou do desenvolvimento de sistemas. Hoje sou estagiário na PRODAM e estudante de ADS na Cruzeiro do Sul. Pratico consultas em Oracle, leio PL/SQL e desenvolvo exercícios em C e JavaScript.</desc><rect x="1" y="1" width="958" height="373" rx="12" fill="#10171e" stroke="#293640"/><path d="M1 44H959" stroke="#293640"/><circle cx="24" cy="23" r="4" fill="#ff7b72"/><circle cx="42" cy="23" r="4" fill="#e7c36a"/><circle cx="60" cy="23" r="4" fill="#80f5b0"/><text x="480.0" y="29" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle">~/sobre-mim</text><text x="28" y="83" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">$ cat trajetoria.md</text><text x="28" y="118" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Minha experiência com processos e implantação de</text><text x="28" y="146" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">ERP me aproximou do desenvolvimento de sistemas.</text><text x="28" y="174" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Hoje sou estagiário na PRODAM e estudante de ADS</text><text x="28" y="202" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">na Cruzeiro do Sul.</text><text x="28" y="242" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Acompanho sistemas de folha de pagamento e estudo</text><text x="28" y="270" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">o caminho entre os dados de cadastro e o</text><text x="28" y="298" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">contracheque.</text><text x="28" y="346" fill="#80f5b0" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Entender o processo. Construir a solução.</text><rect x="575" y="69" width="357" height="240" rx="7" fill="#0b1117" stroke="#293640"/><text x="592" y="97" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">bruno.json</text><path d="M575 112H932" stroke="#293640"/><text x="591" y="137" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">{</text><text x="591" y="156" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  &quot;atuação&quot;: &quot;estágio na PRODAM&quot;,</text><text x="591" y="175" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  &quot;formação&quot;: &quot;ADS&quot;,</text><text x="591" y="194" fill="#91c9ff" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">  &quot;prática&quot;: [</text><text x="591" y="213" fill="#e6edf3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">    &quot;Oracle&quot;, &quot;PL/SQL&quot;,</text><text x="591" y="232" fill="#e6edf3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="400" text-anchor="start">    &quot;C&quot;, &quot;JavaScript&quot;</text><text x="591" y="251" fill="#91c9ff" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="