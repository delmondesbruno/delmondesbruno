<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" role="img" aria-labelledby="title desc"><title id="title">Projetos — CoffeeGo e Número secreto</title><desc id="desc">CoffeeGo: fluxo de pedido e testes de usabilidade. Número secreto: prática de lógica com JavaScript, while e if/else.</desc><rect x="1" y="1" width="958" height="260" rx="12" fill="#131210" stroke="#35312b"/><path d="M1 44H959" stroke="#35312b"/><circle cx="24" cy="23" r="4" fill="#ec8e7e"/><circle cx="42" cy="23" r="4" fill="#dfb379"/><circle cx="60" cy="23" r="4" fill="#80cbc4"/><text x="480.0" y="29" fill="#aaa398" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle">~/projetos</text><rect x="28" y="65" width="438" height="174" rx="7" fill="#11100e" stroke="#35312b"/><text x="46" y="93" fill="#80cbc4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" text-anchor="start">UX / FLUXO DE PEDIDO</text><text x="46" y="124" fill="#dfd9d0" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start">CoffeeGo</text><text x="46" y="150" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Fluxo de compra de uma cafeteria, com testes</text><text x="46" y="171" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">para revisar rótulos e o retorno visual das</text><text x="46" y="192" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">ações.</text><text x="46" y="222" fill="#80cbc4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">carrinho → confirmação</text><rect x="494" y="65" width="438" height="174" rx="7" fill="#11100e" stroke="#35312b"/><text x="512" y="93" fill="#80cbc4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" text-anchor="start">JAVASCRIPT / LÓGICA</text><text x="512" y="124" fill="#dfd9d0" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start">Número secreto</text><text x="512" y="150" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Jogo de adivinhação com sorteio, dicas de</text><text x="512" y="171" fill="#aaa398" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">maior ou menor e contador de tentativas.</text><text x="512" y="222" fill="#80cbc4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">chute → dica → acerto</text></svg>
