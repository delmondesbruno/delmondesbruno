<svg xmlns="http://www.w3.org/2000/svg" width="480" height="662" viewBox="0 0 480 662" role="img" aria-labelledby="title desc"><title id="title">Sobre mim — de processos a sistemas</title><desc id="desc">Minha experiência com processos e implantação de ERP me aproximou do desenvolvimento de sistemas. Hoje sou estagiário na PRODAM e estudante de ADS na Cruzeiro do Sul. Pratico consultas em Oracle, leio PL/SQL e desenvolvo exercícios em C e JavaScript.</desc><rect x="1" y="1" width="478" height="660" rx="12" fill="#10171e" stroke="#293640"/><path d="M1 44H479" stroke="#293640"/><circle cx="24" cy="23" r="4" fill="#ff7b72"/><circle cx="42" cy="23" r="4" fill="#e7c36a"/><circle cx="60" cy="23" r="4" fill="#80f5b0"/><text x="240.0" y="29" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle">~/sobre-mim</text><text x="28" y="83" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">$ cat trajetoria.md</text><text x="28" y="118" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Minha experiência com processos e</text><text x="28" y="146" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">implantação de ERP me aproximou do</text><text x="28" y="174" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">desenvolvimento de sistemas. Hoje sou</text><text x="28" y="202" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">estagiário na PRODAM e estudante de ADS na</text><text x="28" y="230" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Cruzeiro do Sul.</text><text x="28" y="270" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Acompanho sistemas de folha de pagamento e</text><text x="28" y="298" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">estudo o caminho entre os dados de cadastro</text><text x="28" y="326" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">e o contracheque.</text><text x="28" y="374" fill="#80f5b0" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Entender o processo. Construir a solução.</text><rect x="28" y="410" width="424" height="220" rx="7" fill="#0b1117" stroke="#293640"/><text x="45" y="438" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">bruno.json</text><path d="M28 453H452" stroke="#293640"/><text x="44" y="478" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">{</text><text x="44" y="497" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">  &quot;atuação&quot;: &quot;estágio na PRODAM&quot;,</text><text x="44" y="516" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">  &quot;formação&quot;: &quot;ADS&quot;,</text><text x="44" y="535" fill="#91c9ff" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">  &quot;prática&quot;: [</text><text x="44" y="554" fill="#e6edf3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">    &quot;Oracle&quot;, &quot;PL/SQL&quot;,</text><text x="44" y="573" fill="#e6edf3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">    &quot;C&quot;, &quot;JavaScript&quot;</text><text x="44" y="592" fill="#91c9ff" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">  ]</text><text x="44" y="611" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">}</text></svg>