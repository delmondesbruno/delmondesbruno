<svg xmlns="http://www.w3.org/2000/svg" width="480" height="462" viewBox="0 0 480 462" role="img" aria-labelledby="title desc"><title id="title">Projetos — CoffeeGo e Número secreto</title><desc id="desc">CoffeeGo: fluxo de pedido e testes de usabilidade. Número secreto: prática de lógica com JavaScript, while e if/else.</desc><rect x="1" y="1" width="478" height="460" rx="12" fill="#10171e" stroke="#293640"/><path d="M1 44H479" stroke="#293640"/><circle cx="24" cy="23" r="4" fill="#ff7b72"/><circle cx="42" cy="23" r="4" fill="#e7c36a"/><circle cx="60" cy="23" r="4" fill="#80f5b0"/><text x="240.0" y="29" fill="#a3b1bd" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="middle">~/projetos</text><rect x="28" y="65" width="424" height="174" rx="7" fill="#0d141b" stroke="#293640"/><text x="46" y="93" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" text-anchor="start">UX / FLUXO DE PEDIDO</text><text x="46" y="124" fill="#e6edf3" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start">CoffeeGo</text><text x="46" y="150" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Fluxo de compra de uma cafeteria, com testes</text><text x="46" y="171" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">para revisar rótulos e o retorno visual das</text><text x="46" y="192" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">ações.</text><text x="46" y="222" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">carrinho → confirmação</text><rect x="28" y="263" width="424" height="174" rx="7" fill="#0d141b" stroke="#293640"/><text x="46" y="291" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" text-anchor="start">JAVASCRIPT / LÓGICA</text><text x="46" y="322" fill="#e6edf3" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="600" text-anchor="start">Número secreto</text><text x="46" y="348" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Jogo de adivinhação com sorteio, dicas de</text><text x="46" y="369" fill="#a3b1bd" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">maior ou menor e contador de tentativas.</text><text x="46" y="420" fill="#80f5b0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">chute → dica → acerto</text></svg>